<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PostClash — Every post has a rival.</title>
<meta name="theme-color" content="#080A09" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
<style>
:root{
  --bg:#080A09; --panel:#111411; --panel-2:#0D100D; --panel-3:#161B16;
  --border:#1E241E; --border-hi:#2F382F;
  --accent:#39FF14; --violet:#9B5CFF;
  --text:#E8F0E8; --muted:#8A968A; --dim:#5A635A;
  --danger:#FF3B5C; --warn:#FFB020;
  --r:8px; --r-lg:12px;
  --ff:'Space Grotesk',system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--ff);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
.mono{font-family:var(--fm)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1D241D;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:#2A332A}

/* BOOT */
.boot{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;
  place-content:center;justify-items:center;gap:16px;transition:opacity .4s}
.boot.gone{opacity:0;pointer-events:none;visibility:hidden}
.boot-brand{display:flex;align-items:center;gap:10px}
.boot-bar{width:180px;height:2px;background:#1A201A;overflow:hidden;border-radius:2px}
.boot-bar i{display:block;height:100%;width:40%;background:var(--accent);
  animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* BRAND */
.brand{display:flex;align-items:center;gap:9px}
.logo-mark{width:28px;height:28px;border-radius:7px;display:grid;place-content:center;
  background:linear-gradient(135deg,var(--accent),#1E9E0C);
  color:#04120A;font-weight:700;font-size:11px;letter-spacing:-.04em}
.logo-word{font-weight:700;font-size:14px;letter-spacing:.02em}
.logo-word em{font-style:normal;color:var(--accent)}

/* APP SHELL */
.app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100vh}

.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;
  border-bottom:1px solid var(--border);background:rgba(8,10,9,.94);
  backdrop-filter:blur(12px);z-index:50}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:100px;border:1px solid var(--border);font-size:11.5px;
  color:var(--muted);font-family:var(--fm);transition:.15s}
.chip b{color:var(--text);font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:.2s}
.chip.connected{border-color:rgba(57,255,20,.4);color:var(--accent)}
.chip.connected .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.chip.admin{border-color:rgba(155,92,255,.5);color:var(--violet);
  background:rgba(155,92,255,.06)}
.chip.admin .dot{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.chip[data-action]{cursor:pointer}
.chip[data-action]:hover{border-color:var(--border-hi);color:var(--text)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;
  gap:10px;padding:10px;min-height:0;overflow:hidden}

.col-left{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.col-right{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;
  padding-right:2px}

/* PANELS */
.panel{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:14px;flex-shrink:0}
.panel.flex-fill{flex:1;min-height:0;display:flex;flex-direction:column}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.panel-head h2{font-size:14px;letter-spacing:-.02em;font-weight:700}
.panel-head .count{font-family:var(--fm);font-size:10.5px;color:var(--dim);
  border:1px solid var(--border);padding:2px 7px;border-radius:100px}
.panel-head p{color:var(--muted);font-size:11.5px;margin-left:auto;font-family:var(--fm)}

/* HERO STRIP */
.hero-strip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 16px;background:linear-gradient(135deg,#0E110E,#0A0D0A);
  border:1px solid var(--border);border-radius:var(--r-lg);position:relative;
  overflow:hidden;flex-shrink:0}
.hero-strip::before{content:'';position:absolute;top:-100px;right:-50px;
  width:260px;height:260px;
  background:radial-gradient(circle,rgba(57,255,20,.06),transparent 70%);
  pointer-events:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;
  font-family:var(--fm);letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);border:1px solid rgba(57,255,20,.3);
  padding:3px 9px;border-radius:100px;flex-shrink:0}
.hero-eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);
  animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero-mini-title{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.1;
  flex-shrink:0;position:relative;z-index:1}
.hero-mini-title em{font-style:normal;
  background:linear-gradient(90deg,var(--accent),#8FEE7C,var(--accent));
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
.hero-mini-stats{display:flex;gap:18px;margin-left:auto;position:relative;z-index:1}
.hero-mini-stats > div{text-align:right}
.hero-mini-stats > div > b{display:block;font-size:18px;font-weight:700;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.hero-mini-stats > div > span{font-size:9.5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.1em;font-family:var(--fm)}

/* BATTLE TABS */
.battle-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0}
.battle-tab{width:32px;height:32px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--panel-2);
  color:var(--muted);font-family:var(--fm);font-weight:600;font-size:13px;
  transition:.15s;flex-shrink:0}
.battle-tab:hover{border-color:var(--border-hi);color:var(--text)}
.battle-tab.active{background:var(--accent);color:#04120A;border-color:var(--accent);
  box-shadow:0 0 20px rgba(57,255,20,.25)}
.battle-tab.finished{opacity:.4}
.battle-tab.finished.active{background:var(--panel-3);color:var(--text);
  border-color:var(--border-hi);box-shadow:none}

/* BATTLE STAGE — fills remaining vertical space */
.battle-stage{flex:1;min-height:0;display:grid;place-items:center;
  padding:2px 0;overflow:hidden}
.battle-frame{width:100%;height:100%;max-width:1000px;margin:0 auto;
  display:flex;flex-direction:column;aspect-ratio:1.05 / 1;
  max-height:100%}
.battle-frame > .battle{flex:1;min-height:0;display:flex;flex-direction:column}

/* BATTLE CARD */
.battle{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;position:relative;
  transition:border-color .2s ease}
.battle.live::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  background-size:200% 100%;animation:sweep 3s linear infinite;z-index:2}
@keyframes sweep{0%{background-position:200% 0}100%{background-position:-200% 0}}
.battle-head{display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-bottom:1px solid var(--border);background:var(--panel-2);flex-shrink:0}
.status{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:3px 9px;border-radius:100px;border:1px solid}
.status.live{color:var(--accent);border-color:rgba(57,255,20,.35);
  background:rgba(57,255,20,.07)}
.status.live::before{content:'●';margin-right:5px;animation:pulse 1.4s infinite}
.status.ending{color:var(--warn);border-color:rgba(255,176,32,.35);
  background:rgba(255,176,32,.07)}
.status.finished{color:var(--dim);border-color:var(--border-hi);background:var(--panel-3)}
.battle-timer{margin-left:auto;font-family:var(--fm);font-size:12px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.battle-timer b{color:var(--text);font-weight:600}
.arena{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto 1fr}
.arena-vs{display:grid;place-content:center;padding:0 12px;
  font-family:var(--fm);font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:.12em;background:var(--panel-2);position:relative}
.arena-vs::before,.arena-vs::after{content:'';position:absolute;left:50%;
  transform:translateX(-50%);width:1px;height:calc(50% - 20px);
  background:linear-gradient(to bottom,transparent,var(--border-hi))}
.arena-vs::before{top:0}
.arena-vs::after{bottom:0;background:linear-gradient(to top,transparent,var(--border-hi))}
.side{padding:14px;display:flex;flex-direction:column;gap:9px;position:relative;
  overflow:hidden;min-width:0}
.side.winner{background:rgba(57,255,20,.04)}
.side.winner::after{content:'WINNER';position:absolute;top:10px;right:10px;
  font-family:var(--fm);font-size:9px;letter-spacing:.14em;color:var(--accent);
  border:1px solid rgba(57,255,20,.4);padding:2px 6px;border-radius:100px;
  background:rgba(57,255,20,.08);z-index:2}
.side-author{display:flex;align-items:center;gap:8px;min-width:0}
.side-av{width:32px;height:32px;border-radius:50%;background:var(--panel-3);
  flex:none;display:grid;place-content:center;font-weight:600;font-size:12px;
  color:var(--muted);border:1px solid var(--border);overflow:hidden}
.side-av img{width:100%;height:100%;object-fit:cover}
.side-name{font-size:12.5px;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-handle{font-size:10.5px;color:var(--dim);font-family:var(--fm);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-text{font-size:12.5px;color:var(--text);line-height:1.5;flex:1;
  min-height:0;overflow:hidden;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.side-img{width:100%;border-radius:6px;border:1px solid var(--border);
  object-fit:cover;max-height:110px;cursor:pointer;transition:transform .2s;
  flex-shrink:0}
.side-img:hover{transform:scale(1.02)}
.side-link{font-size:10px;color:var(--dim);font-family:var(--fm);flex-shrink:0}
.side-link:hover{color:var(--accent)}
.side-vote-stack{margin-top:auto;display:flex;flex-direction:column;gap:8px;
  flex-shrink:0}
.vote-stats{display:flex;justify-content:space-between;font-size:11.5px;
  font-family:var(--fm);color:var(--muted);font-variant-numeric:tabular-nums}
.vote-stats b{color:var(--text)}
.vote-btn{padding:9px;border-radius:var(--r);border:1px solid var(--border-hi);
  font-weight:600;font-size:12.5px;color:var(--text);transition:.15s;width:100%}
.vote-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);
  background:rgba(57,255,20,.05);transform:translateY(-1px)}
.vote-btn.b:hover:not(:disabled){border-color:var(--violet);color:var(--violet);
  background:rgba(155,92,255,.05)}
.vote-btn:disabled{opacity:.4;cursor:not-allowed}
.vote-btn.voted{background:rgba(57,255,20,.12);border-color:var(--accent);
  color:var(--accent);cursor:default}
.vote-btn.voted.b{background:rgba(155,92,255,.12);border-color:var(--violet);
  color:var(--violet)}
.votebar{height:4px;border-radius:100px;background:var(--panel-3);
  overflow:hidden;display:flex;margin:0 14px 8px;flex-shrink:0}
.votebar i{display:block;height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.vb-a{background:linear-gradient(90deg,#2BC40F,var(--accent))}
.vb-b{background:linear-gradient(90deg,#7B42E8,var(--violet))}
.battle-foot{display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-top:1px solid var(--border);background:var(--panel-2);font-size:10.5px;
  color:var(--dim);font-family:var(--fm);flex-shrink:0}

/* SETTLED STRIP */
.settled-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--border);flex-shrink:0}
.settled-item{display:flex;align-items:center;gap:6px;padding:5px 10px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:100px;
  font-size:10.5px;font-family:var(--fm);color:var(--muted);white-space:nowrap}

/* EMPTY */
.empty{text-align:center;padding:36px 20px;border:1px dashed var(--border);
  border-radius:var(--r-lg);color:var(--muted);background:var(--panel-2);
  width:100%;max-width:440px}
.empty .ico{font-size:24px;opacity:.4;margin-bottom:8px;color:var(--accent)}
.empty h3{color:var(--text);font-size:13px;margin-bottom:5px;font-weight:600}
.empty p{font-size:11.5px;font-family:var(--fm)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:var(--r);font-weight:600;font-size:12.5px;
  border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#04120A}
.btn-primary:hover:not(:disabled){background:#4EFF2A;transform:translateY(-1px)}
.btn-outline{border-color:var(--border-hi);color:var(--text);background:transparent}
.btn-outline:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-ghost{color:var(--muted);background:transparent}
.btn-ghost:hover{color:var(--text);background:var(--panel-3)}
.btn-violet{background:var(--violet);color:#0B0616}
.btn-violet:hover:not(:disabled){background:#AE75FF;transform:translateY(-1px)}
.btn-danger{border:1px solid var(--danger);color:var(--danger);background:transparent}
.btn-danger:hover{background:rgba(255,59,92,.08)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn-block{width:100%}

/* FORM */
.field{margin-bottom:10px}
.field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.1em;font-family:var(--fm)}
.input{width:100%;padding:9px 12px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  font-size:12.5px;font-family:inherit;transition:.15s}
.input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(57,255,20,.1)}
.input.err{border-color:var(--danger)}
.hint{font-size:10.5px;color:var(--dim);margin-top:5px;font-family:var(--fm)}
.hint.err{color:var(--danger)}

.preview{background:var(--panel-2);border:1px solid var(--border);
  border-radius:var(--r);padding:11px;display:flex;flex-direction:column;gap:8px;
  margin-top:8px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.preview-head{display:flex;align-items:center;gap:9px}
.preview-av{width:30px;height:30px;border-radius:50%;background:var(--panel-3);
  flex:none;display:grid;place-content:center;font-weight:600;font-size:11px;
  color:var(--muted);border:1px solid var(--border);overflow:hidden}
.preview-av img{width:100%;height:100%;object-fit:cover}
.preview-name{font-weight:600;font-size:12px}
.preview-handle{font-size:10.5px;color:var(--dim);font-family:var(--fm)}
.preview-text{font-size:11.5px;line-height:1.45;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.preview-imgs{display:grid;gap:5px}
.preview-imgs.one{grid-template-columns:1fr}
.preview-imgs.two{grid-template-columns:1fr 1fr}
.preview-imgs img{width:100%;border-radius:6px;border:1px solid var(--border);
  object-fit:cover;max-height:100px;cursor:pointer}

/* ROWS */
.row{display:flex;align-items:center;gap:9px;padding:9px 11px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--panel-2);
  transition:.15s;margin-top:6px}
.row:hover{border-color:var(--border-hi)}
.row.pick-a{border-color:var(--accent);background:rgba(57,255,20,.06)}
.row.pick-b{border-color:var(--violet);background:rgba(155,92,255,.06)}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap}
.row-sub{font-size:10.5px;color:var(--dim);font-family:var(--fm);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge{font-size:9px;font-family:var(--fm);letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:100px;border:1px solid var(--border-hi);color:var(--muted)}
.badge.accent{color:var(--accent);border-color:rgba(57,255,20,.35);
  background:rgba(57,255,20,.06)}
.badge.violet{color:var(--violet);border-color:rgba(155,92,255,.35);
  background:rgba(155,92,255,.06)}

/* LEADERBOARD */
.leader-row{display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--border)}
.leader-row:last-child{border-bottom:none}
.leader-rank{width:26px;height:26px;border-radius:6px;display:grid;
  place-content:center;font-family:var(--fm);font-weight:600;font-size:11px;
  background:var(--panel-3);color:var(--muted);flex:none}
.leader-rank.top{background:rgba(57,255,20,.1);color:var(--accent);
  border:1px solid rgba(57,255,20,.3)}
.leader-main{flex:1;min-width:0}
.leader-wallet{font-family:var(--fm);font-size:11.5px;font-weight:600;
  display:flex;align-items:center;gap:6px}
.leader-sub{font-size:10px;color:var(--dim);font-family:var(--fm);margin-top:1px}
.leader-val{font-family:var(--fm);font-weight:700;font-size:12.5px;color:var(--accent)}

/* ADMIN */
.admin-badge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;
  font-family:var(--fm);letter-spacing:.1em;text-transform:uppercase;
  color:var(--violet);border:1px solid rgba(155,92,255,.4);
  padding:3px 9px;border-radius:100px;background:rgba(155,92,255,.06);
  margin-bottom:10px}

/* MODAL */
.modal-root{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:rgba(4,6,4,.85);padding:20px;backdrop-filter:blur(6px)}
.modal{background:var(--panel);border:1px solid var(--border-hi);
  border-radius:var(--r-lg);width:min(480px,100%);max-height:80vh;overflow:auto;
  animation:fadeIn .2s ease}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--border)}
.modal-head h3{font-size:14px;flex:1}
.modal-body{padding:18px}

/* TOASTS */
.toast-root{position:fixed;bottom:16px;right:16px;z-index:300;
  display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--panel-3);border:1px solid var(--border-hi);
  border-left:3px solid var(--accent);border-radius:var(--r);
  padding:10px 14px;font-size:12.5px;max-width:300px;font-weight:500;
  pointer-events:auto;animation:slideIn .2s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast.violet{border-left-color:var(--violet)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* ── MOBILE ────────────────────────────────────────── */
@media (max-width:980px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;display:block}
  .layout{grid-template-columns:1fr;padding:10px;gap:10px;overflow:visible;
    min-height:auto}
  .col-left,.col-right{overflow:visible;min-height:auto;padding-right:0}
  .panel.flex-fill{flex:none;min-height:auto}
  .battle-stage{flex:none;padding:0}
  .battle-frame{aspect-ratio:auto;height:auto;max-width:100%}
  .arena{grid-template-columns:1fr;min-height:0}
  .arena-vs{padding:10px 0;border-top:1px solid var(--border);
    border-bottom:1px solid var(--border)}
  .arena-vs::before,.arena-vs::after{display:none}
  .side.winner::after{top:auto;bottom:10px}
  .side-text{-webkit-line-clamp:6}
  .hero-mini-title{font-size:17px}
  .hero-mini-stats{margin-left:0;width:100%;justify-content:space-between;
    padding-top:8px;border-top:1px solid var(--border)}
  .hero-mini-stats > div{text-align:left}
  .toast-root{left:12px;right:12px;bottom:12px}
  .toast{max-width:none}
  .topbar{padding:0 12px}
  .chip{padding:5px 10px;font-size:11px}
  .battle-tab{width:30px;height:30px;font-size:12px}
}

@media (max-width:480px){
  .logo-word{display:none}
  .hero-eyebrow{font-size:9px}
  .hero-mini-title{font-size:15px}
}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot" class="boot">
  <div class="boot-brand">
    <span class="logo-mark">PC</span>
    <span class="logo-word">POST<em>CLASH</em></span>
  </div>
  <div class="boot-bar"><i></i></div>
  <p id="boot-note" class="mono" style="font-size:11px;color:var(--dim)">Connecting…</p>
</div>

<!-- APP -->
<div class="app" id="app-root" hidden>

  <header class="topbar">
    <div class="brand">
      <span class="logo-mark">PC</span>
      <span class="logo-word">POST<em>CLASH</em></span>
    </div>
    <div class="topbar-right">
      <div class="chip"><b id="chip-xp">0</b> XP</div>
      <div class="chip" id="chip-wallet" data-action="wallet-toggle">
        <span class="dot" id="chip-dot"></span>
        <span id="chip-addr">Connect</span>
      </div>
    </div>
  </header>

  <main class="layout">

    <!-- LEFT: HERO STRIP + ARENA -->
    <div class="col-left">

      <div class="hero-strip">
        <span class="hero-eyebrow"><span class="dot"></span> Live on Solana</span>
        <div class="hero-mini-title">Every post has a <em>rival.</em></div>
        <div class="hero-mini-stats">
          <div><b id="stat-live">0</b><span>Live</span></div>
          <div><b id="stat-votes">0</b><span>Votes</span></div>
          <div><b id="stat-users">0</b><span>Clashers</span></div>
        </div>
      </div>

      <section class="panel flex-fill">
        <div class="panel-head">
          <h2>The Arena</h2>
          <span class="count" id="arena-count">0</span>
          <p id="arena-status">Waiting…</p>
        </div>
        <div class="battle-tabs" id="battle-tabs"></div>
        <div class="battle-stage" id="battle-stage"></div>
        <div class="settled-strip" id="settled-strip" hidden></div>
      </section>

    </div>

    <!-- RIGHT: SUBMIT + ADMIN + LEADERBOARD -->
    <div class="col-right">

      <section class="panel" id="submit-section">
        <div class="panel-head"><h2>Submit a post</h2></div>
        <div class="field" style="margin-bottom:8px">
          <input class="input" id="post-url" type="url"
            placeholder="https://x.com/handle/status/…" />
          <p class="hint" id="url-hint">Paste a public X post link</p>
        </div>
        <div id="preview-area"></div>
        <button class="btn btn-primary btn-block" id="btn-submit" disabled
          style="margin-top:10px">
          Connect wallet
        </button>
      </section>

      <section class="panel" id="admin-section" hidden>
        <div class="admin-badge">◆ Admin · GKpg…qNJc</div>
        <div class="panel-head" style="margin-bottom:8px">
          <h2>Control Room</h2>
        </div>

        <p class="hint" style="margin:0 0 4px">Pending</p>
        <div id="pending-list"></div>

        <p class="hint" style="margin:14px 0 4px">Approved · pick two</p>
        <div id="approved-list"></div>

        <div style="margin-top:12px;display:flex;gap:6px">
          <button class="btn btn-violet" id="btn-create-battle"
            data-action="create-battle" disabled style="flex:1">
            ⚔ Create Battle
          </button>
          <button class="btn btn-ghost btn-sm" data-action="clear-picks">✕</button>
        </div>
        <p class="hint" id="pick-status" style="margin-top:6px">Pick A and B.</p>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Leaderboard</h2></div>
        <div id="leaderboard-list" style="margin:-14px -14px 0 -14px"></div>
      </section>

    </div>

  </main>

</div>

<div id="modal" class="modal-root" style="display:none"></div>
<div id="toasts" class="toast-root"></div>

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     CONFIG
     ══════════════════════════════════════════════════════════ */
  const CONFIG = {
    SUPABASE_URL:      'https://ieybzhvjzblbfrtxshwd.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_p0llvOGsjQpls5eUO66iSg_xm8OcR_g',
  };

  const ADMIN_WALLET = 'GKpgaSMUeUPD2AjXb9eiXsbQ1qm6YfGrYY6hHvNgqNJc';
  const XP_PER_VOTE = 5;

  /* ── UTILS ────────────────────────────────────────────── */
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const short = a => a ? a.slice(0,4) + '…' + a.slice(-4) : '';
  const fmt = n => new Intl.NumberFormat('en',
    { notation: n > 9999 ? 'compact' : 'standard' }).format(n || 0);
  const countdown = ms => {
    if (ms <= 0) return '00:00:00';
    const t = Math.floor(ms / 1000);
    return [Math.floor(t/3600), Math.floor((t%3600)/60), t%60]
      .map(x => String(x).padStart(2, '0')).join(':');
  };
  const LS = {
    get(k, d) { try { return JSON.parse(localStorage.getItem('pc_' + k)) ?? d; }
                catch { return d; } },
    set(k, v) { try { localStorage.setItem('pc_' + k, JSON.stringify(v)); } catch {} },
  };

  /* ── STATE ────────────────────────────────────────────── */
  const State = {
    sb: null,
    wallet: null,
    battles: [],
    myVotes: LS.get('votes', {}),
    picks: { a: null, b: null },
    profile: null,
    currentBattleIdx: 0,
    currentBattleId: null,
  };

  /* ── SUPABASE ─────────────────────────────────────────── */
  function initSupabase() {
    if (!window.supabase || !window.supabase.createClient) return null;
    try {
      return window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
        auth: { persistSession: false },
        realtime: { params: { eventsPerSecond: 4 } },
      });
    } catch (e) { console.error('[PostClash]', e); return null; }
  }

  /* ── TOAST / MODAL ────────────────────────────────────── */
  function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(20px)';
      setTimeout(() => el.remove(), 220);
    }, 2800);
  }

  function modal({ title, body }) {
    const root = $('#modal');
    root.style.display = 'grid';
    root.innerHTML =
      '<div class="modal"><div class="modal-head"><h3>' + esc(title) + '</h3>' +
      '<button class="btn btn-ghost btn-sm" data-close>✕</button></div>' +
      '<div class="modal-body">' + body + '</div></div>';
    const close = () => { root.style.display = 'none'; root.innerHTML = ''; };
    root.querySelector('[data-close]').onclick = close;
    root.onclick = e => { if (e.target === root) close(); };
  }

  /* ── WALLET ───────────────────────────────────────────── */
  const Wallet = {
    provider() {
      return window.phantom?.solana?.isPhantom ? window.phantom.solana
           : window.solana?.isPhantom ? window.solana : null;
    },
    isAdmin() { return State.wallet && State.wallet.address === ADMIN_WALLET; },

    async connect() {
      const p = this.provider();
      if (!p) {
        modal({
          title: 'Phantom not detected',
          body: '<p style="color:var(--muted);font-size:13px;margin-bottom:14px">' +
                'Install the Phantom extension to connect.</p>' +
                '<a class="btn btn-primary" href="https://phantom.app/" ' +
                'target="_blank" rel="noopener">Get Phantom</a>',
        });
        return;
      }
      try {
        const res = await p.connect();
        const address = res.publicKey.toString();

        const message = 'PostClash verification\n\nWallet: ' + address +
                        '\nTime: ' + Date.now();
        const encoded = new TextEncoder().encode(message);
        const signed = await p.signMessage(encoded, 'utf8');

        const valid = nacl.sign.detached.verify(
          encoded, signed.signature, res.publicKey.toBytes()
        );
        if (!valid) { toast('Signature failed', 'err'); return; }

        State.wallet = { address };
        LS.set('wallet', address);
        await this.loadProfile();
        this.render();
        await renderAdmin();
        await renderSubmitButton();

        toast(this.isAdmin() ? 'Admin connected' : 'Wallet connected',
              this.isAdmin() ? 'violet' : '');
      } catch (e) {
        if (e && e.code === 4001) toast('Connection rejected', 'warn');
        else toast('Wallet error: ' + (e && e.message || 'unknown'), 'err');
      }
    },

    disconnect() {
      try { this.provider() && this.provider().disconnect(); } catch (e) {}
      State.wallet = null;
      State.profile = null;
      LS.set('wallet', null);
      this.render();
      renderAdmin();
      renderSubmitButton();
      toast('Disconnected');
    },

    async autoReconnect() {
      const saved = LS.get('wallet', null);
      const p = this.provider();
      if (!saved || !p) return;
      try {
        const res = await p.connect({ onlyIfTrusted: true });
        const address = res.publicKey.toString();
        if (address === saved) {
          State.wallet = { address };
          await this.loadProfile();
          this.render();
          await renderAdmin();
          await renderSubmitButton();
        }
      } catch (e) {}
    },

    async loadProfile() {
      if (!State.wallet) { State.profile = null; return; }
      const { data } = await State.sb.from('profiles')
        .select('*').eq('wallet', State.wallet.address).maybeSingle();
      State.profile = data || { wallet: State.wallet.address, xp: 0, wins: 0 };
    },

    render() {
      const chip = $('#chip-wallet');
      const addr = $('#chip-addr');
      const dot  = $('#chip-dot');
      const xp   = $('#chip-xp');
      if (State.wallet) {
        chip.classList.add('connected');
        if (this.isAdmin()) chip.classList.add('admin');
        addr.textContent = short(State.wallet.address);
        dot.style.background = this.isAdmin() ? 'var(--violet)' : 'var(--accent)';
      } else {
        chip.classList.remove('connected', 'admin');
        addr.textContent = 'Connect';
        dot.style.background = 'var(--dim)';
      }
      xp.textContent = fmt(State.profile?.xp || 0);
    },
  };

  /* ── DATA ─────────────────────────────────────────────── */
  async function loadBattles() {
    const { data, error } = await State.sb
      .from('battles')
      .select('id, status, starts_at, ends_at, winner, created_at, ' +
              'entry_a:battle_entries!inner(id, side, post:posts(*)), ' +
              'entry_b:battle_entries!inner(id, side, post:posts(*))')
      .in('status', ['scheduled','live','finalized'])
      .order('created_at', { ascending: false })
      .limit(20);

    if (error) { console.warn('loadBattles:', error.message); return; }

    const ids = (data || []).map(b => b.id);
    const counts = {};
    if (ids.length) {
      const { data: v } = await State.sb.from('votes')
        .select('battle_id,entry_id').in('battle_id', ids);
      (v || []).forEach(r => {
        counts[r.battle_id] = counts[r.battle_id] || {};
        counts[r.battle_id][r.entry_id] = (counts[r.battle_id][r.entry_id] || 0) + 1;
      });
    }

    State.battles = (data || []).map(b => {
      const ea = (b.entry_a || []).find(x => x.side === 'a') || (b.entry_a || [])[0];
      const eb = (b.entry_b || []).find(x => x.side === 'b') || (b.entry_b || [])[0];
      const c = counts[b.id] || {};
      return {
        id: b.id, status: b.status,
        starts_at: b.starts_at, ends_at: b.ends_at, winner: b.winner,
        created_at: b.created_at,
        entry_a: { id: ea?.id, post: ea?.post },
        entry_b: { id: eb?.id, post: eb?.post },
        votes_a: c[ea?.id] || 0,
        votes_b: c[eb?.id] || 0,
      };
    });
  }

  async function loadLeaderboard() {
    const { data } = await State.sb.from('profiles')
      .select('wallet, xp, wins, battles')
      .order('xp', { ascending: false })
      .limit(10);
    return data || [];
  }

  async function settleExpired() {
    const now = new Date().toISOString();
    const { data } = await State.sb.from('battles')
      .select('id').eq('status', 'live').lt('ends_at', now);
    for (const b of data || []) {
      await State.sb.rpc('settle_battle', { p_battle_id: b.id });
    }
  }

  /* ── RENDER STATS ─────────────────────────────────────── */
  async function renderStats() {
    try {
      const { count: bc } = await State.sb.from('battles')
        .select('*', { count: 'exact', head: true }).eq('status', 'live');
      $('#stat-live').textContent = fmt(bc || 0);

      const { count: vc } = await State.sb.from('votes')
        .select('*', { count: 'exact', head: true });
      $('#stat-votes').textContent = fmt(vc || 0);

      const { count: uc } = await State.sb.from('profiles')
        .select('*', { count: 'exact', head: true });
      $('#stat-users').textContent = fmt(uc || 0);
    } catch (e) { console.warn('[stats]', e); }
  }

  /* ── BATTLE STATUS ────────────────────────────────────── */
  function battleStatusOf(b) {
    const now = Date.now();
    const start = new Date(b.starts_at).getTime();
    const end = new Date(b.ends_at).getTime();
    if (b.status === 'finalized') return { cls: 'finished', label: 'FINISHED' };
    if (b.status === 'cancelled') return { cls: 'finished', label: 'CANCELLED' };
    if (now < start) return { cls: 'finished', label: 'SCHEDULED' };
    if (end - now <= 300 * 1000) return { cls: 'ending', label: 'ENDING' };
    return { cls: 'live', label: 'LIVE' };
  }

  /* ── BATTLE CARD ──────────────────────────────────────── */
  function battleCardHTML(b) {
    const st = battleStatusOf(b);
    const total = (b.votes_a + b.votes_b) || 1;
    const pctA = Math.round((b.votes_a / total) * 100);
    const pctB = 100 - pctA;
    const myVote = State.myVotes[b.id];
    const finished = b.status === 'finalized';
    const canVote = !finished && st.cls !== 'finished';

    const sideHTML = (side, entry, cls) => {
      const post = entry?.post || {};
      const isWinner = finished && b.winner === side;
      const voted = myVote === entry?.id;
      const imgs = Array.isArray(post.media) ? post.media : [];
      const mainImg = imgs[0];

      return '<div class="side ' + (isWinner ? 'winner' : '') + '">' +
        '<div class="side-author">' +
          '<div class="side-av">' +
            (post.avatar_url
              ? '<img src="' + esc(post.avatar_url) + '" alt="">'
              : esc((post.author || '?')[0].toUpperCase())) +
          '</div>' +
          '<div style="min-width:0;flex:1">' +
            '<div class="side-name">' + esc(post.author || 'Unknown') + '</div>' +
            '<div class="side-handle">' + esc(post.handle || '@unknown') + '</div>' +
          '</div>' +
        '</div>' +
        (mainImg
          ? '<img class="side-img" src="' + esc(mainImg) + '" alt="" ' +
            'loading="lazy" onclick="window.open(this.src,\'_blank\')">'
          : '') +
        '<p class="side-text">' + esc(post.text || 'No preview.') + '</p>' +
        '<div class="side-vote-stack">' +
          '<div class="vote-stats">' +
            '<span><b>' + fmt(side === 'a' ? b.votes_a : b.votes_b) + '</b> votes</span>' +
            '<span>' + (side === 'a' ? pctA : pctB) + '%</span>' +
          '</div>' +
          '<button class="vote-btn ' + cls + ' ' + (voted ? 'voted' : '') + '" ' +
            'data-vote="' + b.id + '" data-entry="' + (entry?.id || '') + '" ' +
            (!canVote || voted ? 'disabled' : '') + '>' +
            (voted ? '✓ Voted' : finished ? 'Closed' : 'Vote') +
          '</button>' +
        '</div>' +
      '</div>';
    };

    return '<article class="battle ' + (st.cls === 'live' ? 'live' : '') + '">' +
      '<div class="battle-head">' +
        '<span class="status ' + st.cls + '">' + st.label + '</span>' +
        '<span class="battle-timer" data-countdown="' + b.ends_at + '">' +
          '<b>' + countdown(new Date(b.ends_at) - Date.now()) + '</b>' +
        '</span>' +
      '</div>' +
      '<div class="votebar">' +
        '<i class="vb-a" style="width:' + pctA + '%"></i>' +
        '<i class="vb-b" style="width:' + pctB + '%"></i>' +
      '</div>' +
      '<div class="arena">' +
        sideHTML('a', b.entry_a, 'a') +
        '<div class="arena-vs">VS</div>' +
        sideHTML('b', b.entry_b, 'b') +
      '</div>' +
      '<div class="battle-foot">' +
        'ID ' + b.id.slice(0, 6) + ' · ' + fmt(total) + ' votes' +
        (finished && b.winner
          ? ' · <span style="color:var(--accent)">WINNER: ' + b.winner.toUpperCase() + '</span>'
          : '') +
      '</div>' +
    '</article>';
  }

  /* ── RENDER BATTLES (tabs + stage + settled strip) ────── */
  function renderBattles() {
    const live = State.battles.filter(b => b.status === 'live');
    const done = State.battles.filter(b => b.status === 'finalized');

    // Keep current battle valid
    if (State.currentBattleId) {
      const idx = live.findIndex(b => b.id === State.currentBattleId);
      if (idx >= 0) State.currentBattleIdx = idx;
      else State.currentBattleIdx = 0;
    } else {
      State.currentBattleIdx = 0;
    }
    if (live.length) {
      State.currentBattleId = live[State.currentBattleIdx]?.id || null;
    }

    // Tabs
    const tabsEl = $('#battle-tabs');
    if (live.length > 0) {
      tabsEl.hidden = false;
      tabsEl.innerHTML = live.map((b, i) =>
        '<button class="battle-tab ' +
          (i === State.currentBattleIdx ? 'active' : '') + '" ' +
          'data-battle-tab="' + i + '">' + (i + 1) +
        '</button>'
      ).join('');
    } else {
      tabsEl.hidden = true;
      tabsEl.innerHTML = '';
    }

    // Stage
    const stageEl = $('#battle-stage');
    if (live.length) {
      const b = live[State.currentBattleIdx];
      stageEl.innerHTML =
        '<div class="battle-frame">' + battleCardHTML(b) + '</div>';
    } else {
      stageEl.innerHTML = '<div class="empty">' +
        '<div class="ico">◈</div>' +
        '<h3>No live battles</h3>' +
        '<p>' + (Wallet.isAdmin()
          ? 'Create one from the Control Room →'
          : 'Check back soon.') + '</p>' +
      '</div>';
    }

    // Status
    $('#arena-count').textContent = live.length;
    $('#arena-status').textContent = live.length
      ? (State.currentBattleIdx + 1) + ' of ' + live.length
      : 'Waiting for round';

    // Settled strip
    const strip = $('#settled-strip');
    if (done.length) {
      strip.hidden = false;
      strip.innerHTML =
        '<span class="hint" style="margin:0;font-size:10px;align-self:center">Recent:</span>' +
        done.slice(0, 4).map(b => {
          const aHandle = b.entry_a?.post?.handle || '?';
          const bHandle = b.entry_b?.post?.handle || '?';
          const w = b.winner ? b.winner.toUpperCase() : '—';
          return '<div class="settled-item">' +
            esc(aHandle) + ' vs ' + esc(bHandle) +
            ' <span class="badge ' + (b.winner === 'a' ? 'accent' : 'violet') + '">' +
              w + '</span>' +
          '</div>';
        }).join('');
    } else {
      strip.hidden = true;
      strip.innerHTML = '';
    }
  }

  /* ── SUBMIT BUTTON ────────────────────────────────────── */
  async function renderSubmitButton() {
    const btn = $('#btn-submit');
    if (!btn) return;
    if (!State.wallet) {
      btn.disabled = true;
      btn.textContent = 'Connect wallet';
    } else if (!btn.dataset.hasPreview) {
      btn.disabled = true;
      btn.textContent = 'Paste a URL above';
    }
  }

  /* ── ADMIN ────────────────────────────────────────────── */
  async function renderAdmin() {
    const section = $('#admin-section');
    if (!Wallet.isAdmin()) {
      section.hidden = true;
      return;
    }
    section.hidden = false;
    await Promise.all([renderPending(), renderApproved()]);
  }

  async function renderPending() {
    const el = $('#pending-list');
    const { data } = await State.sb.from('posts')
      .select('*').eq('status', 'pending')
      .order('created_at', { ascending: false }).limit(15);

    if (!data || !data.length) {
      el.innerHTML = '<p class="hint" style="margin:0">Nothing pending.</p>';
      return;
    }

    el.innerHTML = data.map(p =>
      '<div class="row">' +
        '<div class="row-main">' +
          '<div class="row-name">' + esc(p.author || 'Unknown') +
            (p.handle ? ' <span class="badge">' + esc(p.handle) + '</span>' : '') +
          '</div>' +
          '<div class="row-sub">' + esc((p.text || p.url).slice(0, 50)) + '…</div>' +
        '</div>' +
        '<button class="btn btn-primary btn-sm" data-approve="' + p.id + '">✓</button>' +
        '<button class="btn btn-danger btn-sm" data-reject="' + p.id + '">✕</button>' +
      '</div>').join('');
  }

  async function renderApproved() {
    const el = $('#approved-list');
    const { data } = await State.sb.from('posts')
      .select('*').eq('status', 'approved')
      .order('created_at', { ascending: false }).limit(15);

    if (!data || !data.length) {
      el.innerHTML = '<p class="hint" style="margin:0">No approved posts yet.</p>';
      return;
    }

    el.innerHTML = data.map(p => {
      const isA = State.picks.a === p.id;
      const isB = State.picks.b === p.id;
      const cls = isA ? 'pick-a' : (isB ? 'pick-b' : '');
      return '<div class="row ' + cls + '">' +
        '<div class="row-main">' +
          '<div class="row-name">' + esc(p.author || 'Unknown') +
            (p.handle ? ' <span class="badge">' + esc(p.handle) + '</span>' : '') +
          '</div>' +
          '<div class="row-sub">' + esc((p.text || p.url).slice(0, 45)) + '…</div>' +
        '</div>' +
        '<button class="btn btn-sm ' + (isA ? 'btn-primary' : 'btn-outline') + '" ' +
          'data-pick-a="' + p.id + '">A</button>' +
        '<button class="btn btn-sm ' + (isB ? 'btn-violet' : 'btn-outline') + '" ' +
          'data-pick-b="' + p.id + '">B</button>' +
      '</div>';
    }).join('');

    updatePickStatus();
  }

  function updatePickStatus() {
    const btn = $('#btn-create-battle');
    const status = $('#pick-status');
    const a = State.picks.a, b = State.picks.b;
    if (a && b && a !== b) {
      btn.disabled = false;
      status.textContent = 'Ready · ' + a.slice(0, 5) + ' vs ' + b.slice(0, 5);
      status.style.color = 'var(--accent)';
    } else {
      btn.disabled = true;
      status.textContent = 'Pick A and B.';
      status.style.color = '';
    }
  }

  /* ── LEADERBOARD ──────────────────────────────────────── */
  async function renderLeaderboard() {
    const rows = await loadLeaderboard();
    const el = $('#leaderboard-list');

    if (!rows.length) {
      el.innerHTML = '<div style="padding:24px 14px;text-align:center;' +
        'color:var(--muted);font-family:var(--fm);font-size:11px">' +
        'No players yet · vote to earn XP' +
      '</div>';
      return;
    }

    el.innerHTML = rows.map((r, i) =>
      '<div class="leader-row">' +
        '<div class="leader-rank ' + (i < 3 ? 'top' : '') + '">' + (i + 1) + '</div>' +
        '<div class="leader-main">' +
          '<div class="leader-wallet">' +
            esc(short(r.wallet)) +
            (r.wallet === ADMIN_WALLET
              ? ' <span class="badge violet">ADMIN</span>' : '') +
          '</div>' +
          '<div class="leader-sub">' + (r.battles || 0) + ' battles · ' +
            (r.wins || 0) + ' wins</div>' +
        '</div>' +
        '<div class="leader-val">' + fmt(r.xp) + ' XP</div>' +
      '</div>').join('');
  }

  /* ── PREVIEW ──────────────────────────────────────────── */
  async function fetchPostPreview(url) {
    try {
      const m = url.match(/(?:x|twitter)\.com\/([^\/]+)\/status\/(\d+)/);
      if (!m) return { error: 'Invalid URL' };
      const [, handle, id] = m;

      const r = await fetch('https://api.fxtwitter.com/' + handle + '/status/' + id);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (d.code !== 200 || !d.tweet) throw new Error('Post not found');

      const t = d.tweet;
      const author = t.author || {};
      const images = [];

      if (t.media && Array.isArray(t.media.photos)) {
        t.media.photos.forEach(p => p && p.url && images.push(p.url));
      }
      if (!images.length && t.media && Array.isArray(t.media.all)) {
        t.media.all.forEach(m => m && m.type === 'photo' && m.url && images.push(m.url));
      }

      return {
        author: author.name || 'Unknown',
        handle: '@' + (author.screen_name || handle),
        text: t.text || '',
        url,
        avatar_url: author.avatar_url || '',
        images,
      };
    } catch (e) {
      console.warn('[Preview]', e.message);
      return { error: e.message };
    }
  }

  function renderPreview(data, target) {
    if (!data || data.error) {
      target.innerHTML =
        '<div class="preview" style="border-color:rgba(255,176,32,.35);' +
        'background:rgba(255,176,32,.04)">' +
        '<div style="color:var(--warn);font-weight:600;font-size:11.5px">' +
        '⚠ Preview unavailable</div>' +
        '<div style="color:var(--dim);font-family:var(--fm);font-size:10px">' +
        esc(data?.error || 'Network error') + '</div>' +
        '</div>';
      return;
    }

    const imgs = data.images || [];
    let imgsHtml = '';
    if (imgs.length) {
      const cls = imgs.length === 1 ? 'one' : 'two';
      imgsHtml = '<div class="preview-imgs ' + cls + '">' +
        imgs.slice(0, 2).map(src =>
          '<img src="' + esc(src) + '" alt="" loading="lazy" ' +
          'onclick="window.open(this.src,\'_blank\')">'
        ).join('') + '</div>';
    }

    target.innerHTML =
      '<div class="preview">' +
        '<div class="preview-head">' +
          '<div class="preview-av">' +
            (data.avatar_url
              ? '<img src="' + esc(data.avatar_url) + '" alt="">'
              : esc((data.author || '?')[0].toUpperCase())) +
          '</div>' +
          '<div style="min-width:0">' +
            '<div class="preview-name">' + esc(data.author) + '</div>' +
            '<div class="preview-handle">' + esc(data.handle) + '</div>' +
          '</div>' +
        '</div>' +
        '<p class="preview-text">' + esc(data.text) + '</p>' +
        imgsHtml +
      '</div>';
  }

  /* ── ACTIONS ──────────────────────────────────────────── */
  async function submitPost(previewData) {
    const row = {
      url: previewData.url,
      author: previewData.author,
      handle: previewData.handle,
      text: previewData.text,
      avatar_url: previewData.avatar_url,
      media: previewData.images || [],
      status: Wallet.isAdmin() ? 'approved' : 'pending',
      submitted_by: State.wallet.address,
    };

    const { error } = await State.sb.from('posts').insert(row);
    if (error) {
      if (error.code === '23505') toast('Already submitted', 'warn');
      else toast('Failed: ' + error.message, 'err');
      return false;
    }

    toast(Wallet.isAdmin() ? 'Auto-approved' : 'Awaiting approval');

    if (Wallet.isAdmin()) await Promise.all([renderPending(), renderApproved()]);

    return true;
  }

  async function castVote(battleId, entryId) {
    const { error } = await State.sb.from('votes').insert({
      battle_id: battleId,
      entry_id: entryId,
      voter: State.wallet.address,
    });
    if (error) {
      if (error.code === '23505') throw new Error('Already voted');
      throw error;
    }
    State.myVotes[battleId] = entryId;
    LS.set('votes', State.myVotes);
    await State.sb.rpc('award_xp', {
      p_wallet: State.wallet.address,
      p_amount: XP_PER_VOTE,
      p_reason: 'vote',
    });
    await Wallet.loadProfile();
    Wallet.render();
  }

  async function approvePost(id) {
    const { error } = await State.sb.from('posts')
      .update({ status: 'approved' }).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    toast('Approved');
    await Promise.all([renderPending(), renderApproved()]);
  }

  async function rejectPost(id) {
    const { error } = await State.sb.from('posts')
      .update({ status: 'rejected' }).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    toast('Rejected');
    await renderPending();
  }

  async function createBattle(aId, bId, minutes = 60) {
    const now = new Date();
    const end = new Date(now.getTime() + minutes * 60 * 1000);

    const { data: battle, error: bErr } = await State.sb.from('battles')
      .insert({
        status: 'live',
        starts_at: now.toISOString(),
        ends_at: end.toISOString(),
      })
      .select()
      .single();

    if (bErr) { toast('Battle failed: ' + bErr.message, 'err'); return; }

    const { error: eErr } = await State.sb.from('battle_entries').insert([
      { battle_id: battle.id, post_id: aId, side: 'a' },
      { battle_id: battle.id, post_id: bId, side: 'b' },
    ]);

    if (eErr) { toast('Entries failed: ' + eErr.message, 'err'); return; }

    toast('Battle live · 60 min', 'violet');
    State.picks = { a: null, b: null };
    State.currentBattleId = battle.id;
    await renderApproved();
    await refresh();
  }

  async function refresh() {
    await settleExpired();
    await loadBattles();
    renderBattles();
    renderStats();
    await renderLeaderboard();
  }

  /* ── EVENTS ───────────────────────────────────────────── */
  document.addEventListener('click', async e => {
    const t = e.target.closest(
      '[data-action],[data-vote],[data-approve],[data-reject],' +
      '[data-pick-a],[data-pick-b],[data-battle-tab]'
    );
    if (!t) return;

    const action = t.dataset.action;

    if (action === 'wallet-toggle') {
      State.wallet ? Wallet.disconnect() : await Wallet.connect();
      return;
    }

    if (action === 'create-battle') {
      const { a, b } = State.picks;
      if (!a || !b || a === b) {
        toast('Pick two different posts', 'warn');
        return;
      }
      await createBattle(a, b);
      return;
    }

    if (action === 'clear-picks') {
      State.picks = { a: null, b: null };
      await renderApproved();
      return;
    }

    if (t.dataset.battleTab !== undefined) {
      State.currentBattleIdx = parseInt(t.dataset.battleTab, 10);
      const live = State.battles.filter(b => b.status === 'live');
      State.currentBattleId = live[State.currentBattleIdx]?.id || null;
      renderBattles();
      return;
    }

    if (t.dataset.vote) {
      if (!State.wallet) {
        toast('Connect wallet to vote', 'warn');
        Wallet.connect();
        return;
      }
      try {
        await castVote(t.dataset.vote, t.dataset.entry);
        toast('+ ' + XP_PER_VOTE + ' XP');
        await loadBattles();
        renderBattles();
      } catch (err) { toast(err.message, 'err'); }
      return;
    }

    if (t.dataset.approve) { await approvePost(t.dataset.approve); return; }
    if (t.dataset.reject)  { await rejectPost(t.dataset.reject); return; }

    if (t.dataset.pickA) {
      State.picks.a = State.picks.a === t.dataset.pickA ? null : t.dataset.pickA;
      await renderApproved();
      return;
    }
    if (t.dataset.pickB) {
      State.picks.b = State.picks.b === t.dataset.pickB ? null : t.dataset.pickB;
      await renderApproved();
      return;
    }
  });

  /* ── SUBMIT FLOW ──────────────────────────────────────── */
  function setupSubmit() {
    const inp = $('#post-url');
    const previewArea = $('#preview-area');
    const btn = $('#btn-submit');
    if (!inp) return;

    let pendingPreview = null;
    let lastUrl = null;

    inp.addEventListener('input', async () => {
      const url = inp.value.trim();
      const valid = /^https?:\/\/(www\.)?(x|twitter)\.com\/[A-Za-z0-9_]+\/status\/\d+/.test(url);

      inp.classList.toggle('err', url.length > 0 && !valid);
      const hint = $('#url-hint');
      hint.className = 'hint' + (url.length > 0 && !valid ? ' err' : '');
      hint.textContent = url.length > 0 && !valid
        ? 'Not a valid X post URL'
        : 'Paste a public X post link';

      previewArea.innerHTML = '';
      pendingPreview = null;
      delete btn.dataset.hasPreview;

      if (!valid || url === lastUrl) { renderSubmitButton(); return; }
      lastUrl = url;

      previewArea.innerHTML = '<div class="preview">' +
        '<div style="color:var(--muted);font-family:var(--fm);font-size:11px">' +
        'Loading preview…</div></div>';

      const data = await fetchPostPreview(url);
      if (lastUrl !== url) return;

      renderPreview(data, previewArea);

      if (data && !data.error) {
        pendingPreview = data;
      } else {
        pendingPreview = { url, author: null, handle: null, text: null,
                           avatar_url: '', images: [] };
      }
      btn.dataset.hasPreview = '1';
      if (State.wallet) {
        btn.disabled = false;
        btn.textContent = data && !data.error
          ? 'Submit post'
          : 'Submit without preview';
      }
    });

    btn.addEventListener('click', async () => {
      if (!pendingPreview) return;
      if (!State.wallet) { Wallet.connect(); return; }

      btn.disabled = true;
      btn.textContent = 'Submitting…';

      const ok = await submitPost(pendingPreview);
      if (ok) {
        inp.value = '';
        previewArea.innerHTML = '';
        pendingPreview = null;
        lastUrl = null;
        delete btn.dataset.hasPreview;
        renderSubmitButton();
      } else {
        btn.disabled = false;
        btn.textContent = 'Submit post';
      }
    });
  }

  /* ── TIMERS ───────────────────────────────────────────── */
  setInterval(() => {
    $$('[data-countdown]').forEach(el => {
      const ms = new Date(el.dataset.countdown).getTime() - Date.now();
      el.innerHTML = '<b>' + countdown(ms) + '</b>';
    });
  }, 1000);

  setInterval(() => refresh(), 30000);

  /* ── BOOT ─────────────────────────────────────────────── */
  async function boot() {
    State.sb = initSupabase();
    if (!State.sb) {
      $('#boot-note').textContent = 'Supabase SDK failed to load.';
      return;
    }

    $('#app-root').hidden = false;

    try { await settleExpired(); } catch (e) { console.warn(e); }

    try {
      await loadBattles();
      renderBattles();
      renderStats();
      await renderLeaderboard();
    } catch (e) { console.error('[boot]', e); }

    setupSubmit();

    await Wallet.autoReconnect();
    Wallet.render();
    renderSubmitButton();
    await renderAdmin();

    $('#boot').classList.add('gone');
  }

  boot().catch(err => {
    console.error('[PostClash]', err);
    const note = $('#boot-note');
    if (note) note.textContent = 'Boot failed — ' + (err.message || 'check console');
  });

})();
</script>
</body>
